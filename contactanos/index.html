<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brightlab | Agenda una reunión</title>
  <meta name="description" content="Agenda una reunión con Brightlab usando nuestra página de reservas." />
  <link rel="icon" href="../brightlab_repo_upload_ready/public/assets/brand/isotype-favicon.png" type="image/png" />
  <style>
    :root {
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #15182d;
      color: #f5f7ff;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      background: rgba(14, 17, 36, 0.92);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .topbar h1 {
      margin: 0;
      line-height: 0;
    }

    .topbar h1 img {
      display: block;
      height: auto;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border-radius: 999px;
      padding: 0.6rem 0.95rem;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      border: 0;
    }

    .btn-home {
      background: #cfb6ff;
      color: #1b1f38;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 70px);
      border: 0;
      background: white;
    }

    @media (max-width: 640px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>
      <img src="../brightlab_repo_upload_ready/public/assets/brand/logo-transparent.png" alt="Brightlab logo" style="width: 145px; height: auto; vertical-align: middle;" />
    </h1>
    <div class="actions">
      <a class="btn btn-home" href="/">Volver al inicio</a>
    </div>
  </header>

  <iframe src="https://outlook.office.com/book/AgendaunareuninconBrightlab@brightlab.pe/?ismsaljsauthenabled" title="Agenda Brightlab" loading="lazy"></iframe>
</body>
</html>
